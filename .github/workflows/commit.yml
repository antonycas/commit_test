on:
  workflow_call:
    inputs:
      # version:
      #   type: string
      #   required: true
      path:
        type: string
        required: true
jobs:
  commit:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ inputs.path }}
          pattern: "${{ inputs.path }}/*.json"
          merge-multiple: true

      - name: Display Git Status
        run: git status